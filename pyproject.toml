[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "neural-digit-classification"
version = "1.0.0"
description = "Reproducible MNIST-style neural digit classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
[project.optional-dependencies]
train = ["tensorflow>=2.16"]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]

